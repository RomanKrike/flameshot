name: Publish aspect ratio Windows prerelease

on:
  push:
    branches: [feature/selection-aspect-ratio]
    paths: [.github/workflows/aspect-ratio-release.yml]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: aspect-ratio-release-v15.0.0-aspect-ratio.1
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: v15.0.0-aspect-ratio.1
      RELEASE_COMMIT: be27abb68f7c5ad8ae12616426b7610a877eec16
      PACKAGE_RUN: '37282957753'
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify the packaging run
        shell: bash
        run: |
          gh api "repos/$GH_REPO/actions/runs/$PACKAGE_RUN" > run.json
          jq -e --arg commit "$RELEASE_COMMIT" \
            '.conclusion == "success" and .head_sha == $commit and .event == "pull_request"' run.json

      - name: Download verified Windows packages
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37282957753
          pattern: flameshot-*-artifact-win-x64-*
          path: packages
          merge-multiple: true

      - name: Verify package checksums
        shell: bash
        run: |
          test -f packages/flameshot-15.0.0-win64.zip
          test -f packages/Flameshot-15.0.0-win64.msi
          # The build's checksum files contain an absolute runner path. Resolve
          # only their basename within the downloaded artifact directory.
          python - <<'PY'
          import hashlib
          from pathlib import Path
          for name in ('flameshot-15.0.0-win64.zip', 'Flameshot-15.0.0-win64.msi'):
              checksum = Path('packages', name + '.sha256sum').read_text().split()
              if len(checksum) != 2 or Path(checksum[1].lstrip('*').replace('\\', '/')).name != name:
                  raise SystemExit('Invalid checksum entry: ' + name)
              actual = hashlib.sha256(Path('packages', name).read_bytes()).hexdigest()
              # GNU sha256sum prefixes the digest with a backslash when
              # escaping backslashes in Windows absolute filenames.
              expected = checksum[0].removeprefix('\\')
              if actual != expected:
                  raise SystemExit(f'Checksum mismatch: {name}: expected {expected}, actual {actual}')
              print('SHA-256 verified:', name)
              Path('packages', name + '.sha256sum').write_text(actual + '  ' + name + '\n')
          PY

      - name: Publish prerelease
        shell: bash
        run: |
          cat > notes.md <<'NOTES'
          Test release of the selection aspect ratio feature for Windows x64.

          - Toolbar presets: Free, 1:1, 4:3, 3:2, 16:9, 9:16 and Current.
          - Ratio lock for new areas, all resize handles and keyboard resizing.
          - Wheel cycling over the aspect ratio button; Russian translation.
          - Every new capture starts in Free mode.

          Existing users: enable Selection Aspect Ratio in Configuration → Interface → Button Selection.
          Для текущего профиля включите «Соотношение сторон выделения» в разделе «Выбор кнопок».

          Download the MSI installer or the portable ZIP. SHA-256 files are included.
          Built from be27abb68f7c5ad8ae12616426b7610a877eec16; Windows packaging,
          Linux/Windows CMake builds and 66 Qt regression checks passed.
          This is a prerelease of the fork, not an official Flameshot release.
          NOTES
          # A rerun never replaces a published release or its assets.
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "Release already exists; leaving it unchanged."
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            --target "$RELEASE_COMMIT" \
            --title "Flameshot 15.0.0 — Selection Aspect Ratio (test)" \
            --notes-file notes.md --prerelease \
            packages/flameshot-15.0.0-win64.zip \
            packages/flameshot-15.0.0-win64.zip.sha256sum \
            packages/Flameshot-15.0.0-win64.msi \
            packages/Flameshot-15.0.0-win64.msi.sha256sum
